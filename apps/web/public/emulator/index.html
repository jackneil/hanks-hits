    /* On-screen gamepad of EmulatorJS 4.2.3. Every control is at least
       48 px, over the 44 px touch rule (the default Start and Select were
       50x31 px, the menu button 24x24 px), no two controls overlap, and no
       control covers the picture of the game.
       - Portrait: EmulatorJS puts the picture at the top
         (video_top_portrait_viewport), so all controls stay in the space
         below it. The bottom row holds five 48 px slots: Fast, Select,
         Start, Slow and the menu button.
       - Landscape: the picture is in the middle, so the bottom row goes to
         the two bottom corners and the menu button to the top right.
       Heights from the bottom of the emulator box: bottom row 8 to 56 px,
       d-pad and face buttons from 64 px, shoulder buttons above them.
       The "#game" prefix beats the EmulatorJS stylesheet, which loads
       later. "!important" only beats the inline top/left/height that
       EmulatorJS sets on each button. EmulatorJS puts "ejs_small_screen"
       (box 575 px wide or less) on #game itself, so those rules say
       "#game.ejs_small_screen". gamepad-layout.test.ts lays the gamepad of
       each console out on four phone sizes and checks these rules;
       emulator-page.test.ts checks some of them one by one. */
    #game .ejs_virtualGamepad_button {
      box-sizing: border-box;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1 !important;
    }
    #game .ejs_virtualGamepad_open {
      box-sizing: border-box;
      width: 48px;
      height: 48px;
      padding: 12px;
      top: 0;
      right: 0;
    }
    #game .ejs_virtualGamepad_parent {
      bottom: 8px;
    }
    #game .ejs_virtualGamepad_left,
    #game .ejs_virtualGamepad_right {
      bottom: 56px;
    }
    /* Shoulder buttons sit just above the d-pad and the face buttons. */
    #game .ejs_virtualGamepad_left .b_l,
    #game .ejs_virtualGamepad_right .b_r {
      top: -56px !important;
    }
    #game .ejs_virtualGamepad_bottom {
      /* Slot k starts at --start + k * (48px + --gap). */
      --gap: min(calc((100% - 256px) / 4), 24px);
      --start: calc((100% - 240px - 4 * var(--gap)) / 2);
      left: 0;
      width: 100%;
      margin-left: 0;
      bottom: 0;
      height: 48px;
    }
    #game .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button {
      top: 0 !important;
      width: 48px;
    }
    /* Rewind (off unless the player turns it on in Settings) goes above the
       middle of the bottom row. */
    #game .ejs_virtualGamepad_bottom .b_speed_rewind {
      top: -56px !important;
      left: calc(50% - 24px) !important;
      right: auto !important;
    }
    @media (orientation: portrait) {
      #game .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button {
        right: auto !important;
      }
      #game .ejs_virtualGamepad_bottom .b_speed_fast {
        left: var(--start) !important;
      }
      #game .ejs_virtualGamepad_bottom .b_select,
      #game .ejs_virtualGamepad_bottom .b_mode {
        left: calc(var(--start) + 48px + var(--gap)) !important;
      }
      #game .ejs_virtualGamepad_bottom .b_start,
      #game .ejs_virtualGamepad_bottom .b_reset {
        left: calc(var(--start) + 2 * (48px + var(--gap))) !important;
      }
      #game .ejs_virtualGamepad_bottom .b_speed_slow {
        left: calc(var(--start) + 3 * (48px + var(--gap))) !important;
      }
      #game .ejs_virtualGamepad_open {
        top: auto;
        bottom: 8px;
        right: calc((100% - 240px - 4 * min(calc((100% - 256px) / 4), 24px)) / 2);
      }
    }
    @media (orientation: landscape) {
      #game .ejs_virtualGamepad_bottom .b_speed_fast {
        left: 8px !important;
        right: auto !important;
      }
      #game .ejs_virtualGamepad_bottom .b_select,
      #game .ejs_virtualGamepad_bottom .b_mode {
        left: 64px !important;
        right: auto !important;
      }
      #game .ejs_virtualGamepad_bottom .b_start,
      #game .ejs_virtualGamepad_bottom .b_reset {
        left: auto !important;
        right: 64px !important;
      }
      #game .ejs_virtualGamepad_bottom .b_speed_slow {
        left: auto !important;
        right: 8px !important;
      }
    }

    /* The menu bar (Save State, Load State, Restart and more). Its buttons
       were 32 px (an 18 px icon and 7 px padding). On a small screen the
       menu is a 300 px popup that stopped at 260 px and cut off the last
       rows; it now scrolls and can use the height of the box. */
    #game .ejs_menu_bar .ejs_menu_button {
      box-sizing: border-box;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    #game.ejs_small_screen .ejs_menu_bar .ejs_menu_button {
      justify-content: flex-start;
    }
    #game.ejs_small_screen .ejs_menu_bar {
      max-height: calc(100% - 16px);
      overflow-y: auto;
    }
    /* In portrait the menu button is in the bottom row (8 to 56 px from
       the bottom). The menu opens above that row, so it never covers the
       menu button, and a second tap on the menu button closes the menu.

    #game .ejs_virtualGamepad_parent:has(.cs_snes) .ejs_virtualGamepad_right {
      width: 150px;

    #game .ejs_virtualGamepad_right .cs_snes.b_y { left: 0 !important; top: 50px !important; }
    #game .ejs_virtualGamepad_right .cs_snes.b_a { left: 100px !important; top: 50px !important; }
    #game .ejs_virtualGamepad_right .cs_snes.b_b { left: 50px !important; top: 100px !important; }

    /* Sega Genesis: A B C over X Y Z. The default rows are 200 px wide with

    @media (max-width: 359px) {

      #game .ejs_virtualGamepad_right .cs_segaMD.b_b,

    #game .ejs_virtualGamepad_right .cs_n64.b_cu { left: 30px !important; top: 0 !important; }
    #game .ejs_virtualGamepad_right .cs_n64.b_cl { left: -20px !important; top: 50px !important; }
    #game .ejs_virtualGamepad_right .cs_n64.b_cr { left: 80px !important; top: 50px !important; }
    #game .ejs_virtualGamepad_right .cs_n64.b_cd { left: 30px !important; top: 100px !important; }
    #game .ejs_virtualGamepad_top .cs_n64.b_l { left: 128px !important; right: auto !important; top: 0 !important; }
    #game .ejs_virtualGamepad_top .cs_n64.b_r { left: auto !important; right: 10px !important; top: 0 !important; }

    #game .ejs_virtualGamepad_top .cs_n64.b_z {

       strips, so it does not change. The page puts "hh_gamepad_shown" on
       #game while EmulatorJS shows the gamepad (see trackGamepad below), so
       a computer without the gamepad keeps the whole box for the picture.
       RetroArch fits the picture in the size of the canvas; it puts the
       picture at the top of a canvas that is taller than it is wide.
       Every layout fits a box of 241 px or more: the box is the screen minus

      #game .ejs_virtualGamepad_right .b_r {
        top: -52px !important;
      }
      #game .ejs_virtualGamepad_right .b_r {

      #game .ejs_virtualGamepad_right .cs_segaMD.b_c,
      #game .ejs_virtualGamepad_right .cs_segaMD.b_z { right: 0 !important; }

<body>
  <div id="loading">
    <div class="icon">🎮</div>
    <div class="text">Loading Emulator...</div>
    <div class="subtext">This may take a moment</div>
  </div>
  <div id="game"></div>

  <script>
    // SECURITY: Get parent origin for secure postMessage
    // This prevents messages from being sent to/received from unauthorized origins
    const PARENT_ORIGIN = window.location.origin;

    // SECURITY: Allowed ROM URL patterns. ROMs come from this site only:
    // the /api/roms proxy or a same-origin blob: URL for an uploaded ROM.
    // The CSP connect-src ('self' blob:) blocks every other host, so the
    // page refuses those URLs here with a clear message.
    const ALLOWED_ROM_PATTERNS = [
      new RegExp(`^${window.location.origin.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}/`),  // Same origin
      /^\/[^/]/,  // Relative paths (starting with /)
    ];

    // SECURITY: The consoles that Retro Arcade offers, with the EmulatorJS
    // core (EJS_core) and control layout (EJS_controlScheme) of each. The
    // site hosts the cores for these consoles only. The values are the same
    // as ejsCore and ejsControlScheme in
    // src/games/retro-arcade/lib/constants.ts (emulator-page.test.ts checks).
    // "coreSystem" marks a core name: the EmulatorJS system that lists the
    // core. The page pins that core (see pinCore below).
    const SYSTEM_CONFIG = {
      nes: { core: 'nes' },
      snes: { core: 'snes' },
      // Game Boy and Game Boy Color games run on mGBA. Before, they ran on
      // Gambatte. RetroArch keeps battery saves in one folder per core, so
      // the page copies old Gambatte saves to the mGBA folder (see below).
      gb: {
        core: 'mgba',
        controlScheme: 'gb',
        coreSystem: 'gba',
        oldSaveFolder: '/data/saves/Gambatte',
        saveFolder: '/data/saves/mGBA',
      },
      gba: { core: 'gba' },
      segaMD: { core: 'segaMD' },
      // Nintendo 64 games run on mupen64plus_next on every device. For
      // "n64", EmulatorJS picks parallel_n64 on an iPhone, and on a real
      // iPhone that core stopped at boot and hung the tab on a resume (see
      // constants.ts).
      n64: { core: 'mupen64plus_next', controlScheme: 'n64', coreSystem: 'n64' },
      atari2600: { core: 'atari2600' },
    };

    /**
     * Copies each battery save (.srm) from oldFolder to newFolder, when
     * newFolder does not have a save with that name. The old file stays.
     * A .srm file is the cartridge RAM as it is, so the new core reads it.
     * Returns the names of the copied files.
     */
    function copyOldSaves(FS, oldFolder, newFolder) {
      if (!FS.analyzePath(oldFolder).exists) return [];
      const copied = [];
      for (const name of FS.readdir(oldFolder)) {
        if (!/\.srm$/i.test(name)) continue;
        const target = newFolder + '/' + name;
        if (FS.analyzePath(target).exists) continue;
        if (!FS.analyzePath(newFolder).exists) FS.mkdir(newFolder);
        FS.writeFile(target, FS.readFile(oldFolder + '/' + name));
        copied.push(name);
      }
      return copied;
    }

    /**
     * Pins the core of a console whose EJS_core is a core name: EmulatorJS
     * loads that core only. It hides the Core setting, and it removes a core
     * choice that EmulatorJS kept for this game, because a stored choice
     * beats EJS_core (preGetSetting "retroarch_core"). EmulatorJS keeps the
     * settings of a game in localStorage under "ejs-<game id>-<system>-<game
     * name>-settings" (getLocalStorageKey); the page sets no game id, so the
     * id is 1.
     */
    function pinCore(win, coreSystem, name) {
      win.EJS_hideSettings = ['retroarch_core'];
      const key = 'ejs-1-' + coreSystem + '-' + name + '-settings';
      try {
        const storage = win.localStorage;
        const raw = storage ? storage.getItem(key) : null;
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !saved.settings || !Object.prototype.hasOwnProperty.call(saved.settings, 'retroarch_core')) return;
        delete saved.settings.retroarch_core;
        storage.setItem(key, JSON.stringify(saved));
      } catch (e) {
        // The pinned core still loads unless the player picked another one.
        console.warn('Could not remove the stored core choice', e);
      }
    }

    function isValidRomUrl(url) {
      if (!url) return false;

      // Block dangerous protocols
      const lowerUrl = url.toLowerCase();
      if (lowerUrl.startsWith('javascript:') ||
          lowerUrl.startsWith('data:') ||
          lowerUrl.startsWith('vbscript:')) {
        return false;
      }

      // SECURITY: Allow blob: URLs but only from same origin
      // User-uploaded ROMs use blob: URLs created via URL.createObjectURL()
      if (url.startsWith('blob:')) {
        try {
          // blob: URLs have format: blob:https://origin/uuid
          const blobUrl = new URL(url);
          // The origin is in the pathname for blob URLs
          const blobOrigin = blobUrl.origin;
          return blobOrigin === window.location.origin;
        } catch {
          return false;
        }
      }

      // Allow relative URLs (same origin) but NOT protocol-relative URLs
      // Protocol-relative URLs like //evil.com would bypass validation
      if (url.startsWith('/') && !url.startsWith('//')) {
        return true;
      }

      // Must be valid URL for HTTPS
      try {
        const parsed = new URL(url);
        // Only allow HTTPS
        if (parsed.protocol !== 'https:') {
          return false;
        }
      } catch {
        return false;
      }

      // Check against allowed patterns
      return ALLOWED_ROM_PATTERNS.some(pattern => pattern.test(url));
    }

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const core = params.get('core') || 'nes';
    const romUrl = params.get('rom');
    // SECURITY: Sanitize game name to prevent XSS
    const gameName = (params.get('name') || 'Game').replace(/[<>"'&]/g, '');

    // KID SAFETY: this page plays a game only inside Retro Arcade (an iframe
    // of this site). The arcade is the one gate that starts a game, and it
    // shows the heads-up card for a mainstream violent classic first (Jack,
    // 2026-10-02). A direct link to this page must not skip that card, so
    // the page refuses to start when it is not in a frame.
    if (window.parent === window) {
      document.getElementById('loading').innerHTML = `
        <div class="icon">🕹️</div>
        <div class="text">Play this game in Retro Arcade</div>
        <div class="subtext"><a href="/games/retro-arcade" style="display: inline-block; min-height: 44px; padding: 12px 16px; box-sizing: border-box; color: #93c5fd; text-decoration: underline;">Open Retro Arcade</a></div>
      `;
      throw new Error('The emulator page runs only inside Retro Arcade');
    }

    // Validate required parameters. hasOwnProperty: a name such as
    // "constructor" must not match a property of Object.prototype.
    const system = Object.prototype.hasOwnProperty.call(SYSTEM_CONFIG, core) ? SYSTEM_CONFIG[core] : null;
    if (!system) {
      document.getElementById('loading').innerHTML = `
        <div class="icon">🚫</div>
        <div class="text">We cannot play this game here</div>
        <div class="subtext">Go back and pick a different game.</div>
      `;
      throw new Error('Unsupported core: ' + core);
    }

    if (!romUrl) {
      document.getElementById('loading').innerHTML = `
        <div class="icon">⚠️</div>
        <div class="text">No ROM specified</div>
        <div class="subtext">Please provide a ROM file</div>
      `;
      throw new Error('No ROM URL provided');
    }

    // SECURITY: Validate ROM URL
    if (!isValidRomUrl(romUrl)) {
      document.getElementById('loading').innerHTML = `
        <div class="icon">🚫</div>
        <div class="text">Invalid ROM URL</div>
        <div class="subtext">ROM must be from an authorized source</div>
      `;
      throw new Error('Invalid ROM URL: ' + romUrl);
    }

    // EmulatorJS configuration
    window.EJS_player = '#game';
    window.EJS_core = system.core;
    if (system.controlScheme) window.EJS_controlScheme = system.controlScheme;
    if (system.coreSystem) pinCore(window, system.coreSystem, gameName);

    // Keep a kid's Game Boy progress after the change of core. EmulatorJS
    // mounts the saves folder, sends "saveDatabaseLoaded", and only then
    // loads the game. loader.js sets window.EJS_emulator immediately after it
    // makes the emulator, so this setter adds the handler in time.
    if (system.oldSaveFolder) {
      let emulator;
      Object.defineProperty(window, 'EJS_emulator', {
        configurable: true,
        get: function() { return emulator; },
        set: function(value) {
          emulator = value;
          value.on('saveDatabaseLoaded', function(FS) {
            try {
              const copied = copyOldSaves(FS, system.oldSaveFolder, system.saveFolder);
              if (copied.length > 0) console.log('Copied old saves to ' + system.saveFolder + ': ' + copied.join(', '));
            } catch (e) {
              // The game still starts. It does not see the old save.
              console.warn('Could not copy the old saves', e);
            }
          });
        },
      });
    }
    window.EJS_gameUrl = romUrl;
    window.EJS_gameName = gameName;
    // EmulatorJS 4.2.3 is served from this site (issue #22). The files come
    // from the official release; /emulator/ejs/4.2.3/manifest.json records
    // the source and the SHA-256 of each file. To change the version, run
    // apps/web/scripts/vendor-emulatorjs.mjs, change this path and the
    // loader.js path below, then update the version in the three tests in
    // src/games/retro-arcade/__tests__/ (emulator-pin, emulator-selfhost,
    // emulator-page).
    window.EJS_pathtodata = '/emulator/ejs/4.2.3/';

    // Kid-friendly defaults
    window.EJS_volume = 0.5;
    window.EJS_startOnLoaded = true;
    window.EJS_fullscreenOnLoaded = false;
    window.EJS_color = '#3B82F6';

    // Display settings - helps with aspect ratio for unusual resolutions (Atari 2600 is 160x192)
    window.EJS_backgroundBlur = true;
    window.EJS_defaultOptions = {
      'shader': 'disabled',  // Disable shaders to avoid rendering issues
    };

    // The menu a kid sees. EmulatorJS also lists Cheats, Cache Manager,
    // Export and Import Save File, Screen Record, Screenshot and Quick
    // Save/Load: grown-up tools, and the first thing a kid saw over Mario
    // (phone UX audit 2026-09-29). Save State and Load State stay: the
    // parent page keeps those saves.
    window.EJS_Buttons = {
      cheat: false,
      cacheManager: false,
      saveSavFiles: false,
      loadSavFiles: false,
      screenRecord: false,
      screenshot: false,
      quickSave: false,
      quickLoad: false,
      exitEmulation: {
        visible: true,
        callback: function() {
          // Notify parent when user exits via EmulatorJS controls
          window.parent.postMessage({ type: 'emulator-exit' }, PARENT_ORIGIN);
        }
      }
    };

    // Virtual gamepad on mobile: EmulatorJS shows its built-in touch gamepad
    // automatically on mobile devices, with a per-core default layout (SNES gets
    // d-pad + A/B/X/Y + start/select + shoulders). EJS_VirtualGamepadSettings
    // exists only to REPLACE that layout and must be an ARRAY of button/zone/dpad
    // definitions (https://emulatorjs.org/docs4devs/virtual-gamepad-settings).
    // A previous version set it to an options OBJECT ({enabled, opacity, ...}),
    // which is not a real EmulatorJS API and risks breaking the gamepad, so it
    // is deliberately NOT set: the defaults are what we want.

    /**
     * Keeps "hh_gamepad_shown" on #game while EmulatorJS shows the on-screen
     * gamepad (the style block uses it for the landscape strips). EmulatorJS
     * shows the gamepad on a phone and hides it on a computer, and the
     * player can turn it off in Settings; it sets style.display each time.
     * When the box changes size, EmulatorJS shows a hidden gamepad for
     * 250 ms at opacity 0 to measure it; that does not count as shown.
     */
    function trackGamepad() {
      const emulator = window.EJS_emulator;
      const pad = emulator && emulator.virtualGamepad;
      const game = document.getElementById('game');
      if (!pad || !game) return;
      const update = function() {
        const shown = pad.style.display !== 'none' && pad.style.opacity !== '0';
        game.classList.toggle('hh_gamepad_shown', shown);
      };
      update();
      new MutationObserver(update).observe(pad, { attributes: true, attributeFilter: ['style'] });
    }

    // Notify parent when emulator is ready
    // SECURITY: Use specific origin instead of wildcard '*'
    window.EJS_onGameStart = function() {
      document.getElementById('loading').classList.add('hidden');
      // EmulatorJS opens its menu over the picture for 3 s when a game
      // starts (on a phone a 300 px grid of buttons). The game starts clean;
      // the menu button still opens it.
      try {
        window.EJS_emulator.menu.close();
      } catch (e) {
        console.warn('Could not close the EmulatorJS menu', e);
      }
      window.parent.postMessage({ type: 'ready' }, PARENT_ORIGIN);
      try {
        trackGamepad();
      } catch (e) {
        // The game plays; the picture keeps the whole box.
        console.warn('Could not watch the on-screen gamepad', e);
      }
    };

    // Save states. The Retro Arcade page (the parent) keeps them on this
    // device in IndexedDB; this page only moves the bytes. EmulatorJS 4.2.3
    // calls EJS_onSaveState with { screenshot, format, state }, where state
    // is a Uint8Array. The bytes go to the parent as an ArrayBuffer in the
    // transfer list, so a 16 MB state is not copied.
    // src/games/retro-arcade/lib/emulatorMessages.ts lists every message.
    function stateBuffer(state) {
      if (!(state instanceof Uint8Array) || state.byteLength === 0) return null;
      if (state.byteOffset === 0 && state.byteLength === state.buffer.byteLength) return state.buffer;
      return state.buffer.slice(state.byteOffset, state.byteOffset + state.byteLength);
    }

    function gameManager() {
      const emulator = window.EJS_emulator;
      return emulator && emulator.gameManager ? emulator.gameManager : null;
    }

    // SECURITY: Use specific origin instead of wildcard '*'
    window.EJS_onSaveState = function(event) {
      const buffer = stateBuffer(event && event.state);
      if (!buffer) {
        window.parent.postMessage({ type: 'saveStateFailed' }, PARENT_ORIGIN);
        return;
      }
      window.parent.postMessage({ type: 'saveState', state: buffer }, PARENT_ORIGIN, [buffer]);
    };

    window.EJS_onLoadState = function() {
      window.parent.postMessage({ type: 'requestLoadState' }, PARENT_ORIGIN);
    };

    // Listen for messages from parent
    // SECURITY: Accept a message only from the parent window, on this origin.
    window.addEventListener('message', function(event) {
      if (event.origin !== PARENT_ORIGIN || event.source !== window.parent) {
        console.warn('Ignoring message from unauthorized origin:', event.origin);
        return;
      }
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'loadState') {
        const reason = data.reason === 'resume' ? 'resume' : 'manual';
        const manager = gameManager();
        if (!manager || !(data.state instanceof ArrayBuffer) || data.state.byteLength === 0) {
          window.parent.postMessage({ type: 'stateLoadFailed', reason: reason }, PARENT_ORIGIN);
          return;
        }
        try {
          manager.loadState(new Uint8Array(data.state));
          window.parent.postMessage({ type: 'stateLoaded', reason: reason }, PARENT_ORIGIN);
        } catch (e) {
          console.warn('Could not load the save state', e);
          window.parent.postMessage({ type: 'stateLoadFailed', reason: reason }, PARENT_ORIGIN);
        }
        return;
      }

      // The parent asks for the current state when the kid leaves the game
      // or the page goes to the background (the "auto" save).
      if (data.type === 'captureState') {
        const requestId = typeof data.requestId === 'number' ? data.requestId : 0;
        let buffer = null;
        try {
          const manager = gameManager();
          buffer = manager ? stateBuffer(manager.getState()) : null;
        } catch (e) {
          console.warn('Could not make a save state', e);
        }
        window.parent.postMessage(
          { type: 'capturedState', requestId: requestId, state: buffer },
          PARENT_ORIGIN,
          buffer ? [buffer] : []
        );
      }
    });

    // Load the EmulatorJS loader script

    const script = document.createElement('script');
    script.src = '/emulator/ejs/4.2.3/loader.js';
    script.async = true;
    script.onerror = function() {
      document.getElementById('loading').innerHTML = `
        <div class="icon">❌</div>
        <div class="text">Failed to load emulator</div>
        <div class="subtext">Please check your internet connection</div>
      `;
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
